name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  STOCK_REORDER_KILL_SWITCH: "0"

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Read project version
        run: |
          echo "PROJECT_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Validate SemVer
        run: |
          python - <<'EOF'
          import re
          v = open("VERSION").read().strip()
          assert re.match(r"^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$", v), f"Invalid SemVer: {v}"
          print(f"Version {v} is valid SemVer")
          EOF

      - name: Validate agent cards
        run: |
          python - <<'EOF'
          from agents.cards import load_cards, validate_card
          cards = load_cards()
          assert cards, "no agent cards found"
          for role, card in cards.items():
              problems = validate_card(card)
              assert not problems, f"Agent card {role} invalid: {problems}"
              print(f"  [ok] {role}: {card.name} v{card.version} ({card.provider}/{card.model})")
          print(f"All {len(cards)} agent cards valid")
          EOF

      - name: Lint
        run: ruff check .

      - name: Test (unit + integration)
        run: pytest

      - name: Full pipeline tests (stubbed models, offline)
        run: pytest tests/test_full_pipeline.py -q

      - name: Kill switch test
        run: |
          python - <<'EOF'
          from kill_switch import is_killed, activate, deactivate, check_or_raise
          assert not is_killed(), "kill switch should be inactive by default"
          activate(reason="ci test")
          assert is_killed(), "kill switch should be active after activate()"
          try:
              check_or_raise()
              assert False, "should have raised RuntimeError"
          except RuntimeError:
              pass
          deactivate()
          assert not is_killed(), "kill switch should be inactive after deactivate()"
          print("Kill switch tests passed")
          EOF

      - name: Check the SQL parses for both dialects
        run: python -m pytest tests/test_db.py -q

      - name: Check no secrets are committed
        run: |
          python scan_secrets.py .
          # The scanner exits non-zero only for live secrets; .env must never
          # be committed, so fail the build if it is tracked.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git - it must not be"
            exit 1
          fi

  full-pipeline:
    name: full pipeline (CLI end-to-end)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Model routing display (no keys needed)
        run: python main.py --routing

      - name: Full pipeline - WH-NORTH (stubbed models)
        env:
          LARP_ROUTER_API_KEY: stub
          OPENROUTER_API_KEY: stub
          NVIDIA_API_KEY: stub
        run: |
          python - <<'EOF'
          import main as app
          from tests.test_pipeline import StubLLM, reorder_handler, supplier_handler, cost_handler
          from db.setup import seed_database
          from pathlib import Path
          import tempfile
          stubs = {
              "reorder_analyst": StubLLM(reorder_handler),
              "supplier_scout": StubLLM(supplier_handler),
              "cost_optimizer": StubLLM(cost_handler),
          }
          app.build_llm = lambda spec, usage=None: stubs[spec.role]
          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "ci.db"
              seed_database(db)
              code = app.main(["--db", str(db), "--warehouse", "WH-NORTH", "--max-items", "5"])
              assert code == 0, f"WH-NORTH pipeline exited {code}"
              print("WH-NORTH full pipeline OK")
          EOF

      - name: Full pipeline - WH-WEST (stubbed models)
        env:
          LARP_ROUTER_API_KEY: stub
          OPENROUTER_API_KEY: stub
          NVIDIA_API_KEY: stub
        run: |
          python - <<'EOF'
          import main as app
          from tests.test_pipeline import StubLLM, reorder_handler, supplier_handler, cost_handler
          from db.setup import seed_database
          from pathlib import Path
          import tempfile
          stubs = {
              "reorder_analyst": StubLLM(reorder_handler),
              "supplier_scout": StubLLM(supplier_handler),
              "cost_optimizer": StubLLM(cost_handler),
          }
          app.build_llm = lambda spec, usage=None: stubs[spec.role]
          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "ci.db"
              seed_database(db)
              code = app.main(["--db", str(db), "--warehouse", "WH-WEST", "--max-items", "5"])
              assert code == 0, f"WH-WEST pipeline exited {code}"
              print("WH-WEST full pipeline OK")
          EOF

      - name: Full pipeline - WH-CENTRAL (stubbed models)
        env:
          LARP_ROUTER_API_KEY: stub
          OPENROUTER_API_KEY: stub
          NVIDIA_API_KEY: stub
        run: |
          python - <<'EOF'
          import main as app
          from tests.test_pipeline import StubLLM, reorder_handler, supplier_handler, cost_handler
          from db.setup import seed_database
          from pathlib import Path
          import tempfile
          stubs = {
              "reorder_analyst": StubLLM(reorder_handler),
              "supplier_scout": StubLLM(supplier_handler),
              "cost_optimizer": StubLLM(cost_handler),
          }
          app.build_llm = lambda spec, usage=None: stubs[spec.role]
          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "ci.db"
              seed_database(db)
              code = app.main(["--db", str(db), "--warehouse", "WH-CENTRAL", "--max-items", "5"])
              assert code == 0, f"WH-CENTRAL pipeline exited {code}"
              print("WH-CENTRAL full pipeline OK")
          EOF

      - name: Budget over-cap retry (stubbed models)
        env:
          LARP_ROUTER_API_KEY: stub
          OPENROUTER_API_KEY: stub
          NVIDIA_API_KEY: stub
        run: |
          python - <<'EOF'
          import main as app
          from tests.test_pipeline import StubLLM, reorder_handler, supplier_handler, cost_handler
          from db.setup import seed_database
          from pathlib import Path
          import tempfile
          stubs = {
              "reorder_analyst": StubLLM(reorder_handler),
              "supplier_scout": StubLLM(supplier_handler),
              "cost_optimizer": StubLLM(cost_handler),
          }
          app.build_llm = lambda spec, usage=None: stubs[spec.role]
          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "ci.db"
              seed_database(db)
              code = app.main([
                  "--db", str(db), "--warehouse", "WH-NORTH",
                  "--max-items", "3", "--budget", "1",
              ])
              assert code == 0, f"over-budget pipeline exited {code}"
              print("over-budget retry OK")
          EOF

      - name: Dashboard sheet build (no keys needed)
        run: |
          python - <<'EOF'
          import main as app
          import observability as obs
          from observability import RunRecorder
          from pathlib import Path
          import tempfile
          with tempfile.TemporaryDirectory() as tmp:
              runs_dir = Path(tmp) / "runs"
              ok = RunRecorder(runs_dir=runs_dir, correlation_id="REQ-CI-OK")
              ok.meta = {"warehouse": "WH-NORTH"}
              with ok.step(stage="scan", role="db_scan", provider="local", model="deterministic"):
                  pass
              ok.finish("ok")
              obs.RUNS_DIR = runs_dir
              obs.ROOT = Path(tmp)
              code = app.main(["--dashboard-sheet"])
              assert code == 0, f"dashboard-sheet exited {code}"
              assert (Path(tmp) / "dashboard.html").exists(), "dashboard.html not produced"
              print("dashboard sheet build OK")
          EOF

  package:
    name: build the delivery package
    runs-on: ubuntu-latest
    needs: [test, full-pipeline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build
        run: python deliver.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-reorder-agents
          path: dist/stock-reorder-agents.zip

  # -----------------------------------------------------------------------
  # Stage 3: docker (build + test container)
  # -----------------------------------------------------------------------
  docker:
    name: docker build and test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read project version
        run: |
          echo "STOCK_REORDER_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: stock-reorder-agents:local
          build-args: |
            STOCK_REORDER_VERSION=${{ env.STOCK_REORDER_VERSION }}

      - name: Test container health check
        run: |
          docker run --rm --name stock-reorder-test \
            -e LARP_ROUTER_API_KEY=stub \
            -e OPENROUTER_API_KEY=stub \
            -e NVIDIA_API_KEY=stub \
            -e STOCK_REORDER_KILL_SWITCH=0 \
            stock-reorder-agents:local --routing

      - name: Test container kill switch
        run: |
          set +e
          docker run --rm --name stock-reorder-kill \
            -e STOCK_REORDER_KILL_SWITCH=1 \
            stock-reorder-agents:local --routing > /dev/null 2>&1
          code=$?
          echo "Kill switch exit code: $code"
          test "$code" -eq 3

  # -----------------------------------------------------------------------
  # Stage 4: package (build delivery zip)
  # -----------------------------------------------------------------------
  package:
    name: build the delivery package
    runs-on: ubuntu-latest
    needs: [test, full-pipeline, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build
        run: python deliver.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-reorder-agents
          path: dist/stock-reorder-agents.zip

  # -----------------------------------------------------------------------
  # Stage 5: release (git tag on version bump)
  # -----------------------------------------------------------------------
  release:
    name: create git tag on version bump
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'bump')
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: |
          echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV
      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "v${VERSION}"
