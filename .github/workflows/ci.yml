name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (major, minor, patch)'
        required: false
        default: 'patch'
      tag_release:
        description: 'Create git tag after successful release'
        required: false
        default: 'true'

env:
  STOCK_REORDER_KILL_SWITCH: "0"

jobs:
  # -----------------------------------------------------------------------
  # Stage 0: Version bump (manual dispatch only)
  # -----------------------------------------------------------------------
  bump-version:
    name: bump version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump != ''
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version
        id: bump
        run: |
          python scripts/bump_version.py ${{ github.event.inputs.bump }} --tag
          echo "new_version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add VERSION pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push origin main

  # -----------------------------------------------------------------------
  # Stage 1: test (lint + unit + integration + agent cards + version)
  # -----------------------------------------------------------------------
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Read project version
        run: |
          echo "PROJECT_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Validate SemVer
        run: |
          python - <<'EOF'
          import re
          v = open("VERSION").read().strip()
          assert re.match(r"^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$", v), f"Invalid SemVer: {v}"
          print(f"Version {v} is valid SemVer")
          EOF

      - name: Validate agent cards
        run: |
          python - <<'EOF'
          from agents.cards import load_cards, validate_card
          cards = load_cards()
          assert cards, "no agent cards found"
          for role, card in cards.items():
              problems = validate_card(card)
              assert not problems, f"Agent card {role} invalid: {problems}"
              print(f"  [ok] {role}: {card.name} v{card.version} ({card.provider}/{card.model})")
          print(f"All {len(cards)} agent cards valid")
          EOF

      - name: Lint
        run: ruff check .

      - name: Test (unit + integration)
        run: pytest

      - name: Full pipeline tests (stubbed models, offline)
        run: pytest tests/test_full_pipeline.py -q

      - name: Kill switch test
        run: |
          python - <<'EOF'
          from kill_switch import is_killed, activate, deactivate, check_or_raise
          assert not is_killed(), "kill switch should be inactive by default"
          activate(reason="ci test")
          assert is_killed(), "kill switch should be active after activate()"
          try:
              check_or_raise()
              assert False, "should have raised RuntimeError"
          except RuntimeError:
              pass
          deactivate()
          assert not is_killed(), "kill switch should be inactive after deactivate()"
          print("Kill switch tests passed")
          EOF

      - name: Check the SQL parses for both dialects
        run: python -m pytest tests/test_db.py -q

      - name: Check no secrets are committed
        run: |
          python scan_secrets.py .
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git - it must not be"
            exit 1
          fi

  # -----------------------------------------------------------------------
  # Stage 2: rollback on failure
  # -----------------------------------------------------------------------
  rollback-on-failure:
    name: auto rollback on failure
    runs-on: ubuntu-latest
    needs: test
    if: ${{ failure() }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read current and previous versions
        id: versions
        run: |
          current=$(cat VERSION)
          previous=$(python rollback.py previous-tag)
          echo "current=$current" >> $GITHUB_OUTPUT
          echo "previous=$previous" >> $GITHUB_OUTPUT

      - name: Rollback version
        if: ${{ steps.versions.outputs.previous != '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          python rollback.py version-rollback ${{ steps.versions.outputs.previous }}
          git add VERSION pyproject.toml
          git commit -m "chore: rollback version to ${{ steps.versions.outputs.previous }} after CI failure"
          git push origin main

      - name: Notify rollback
        run: |
          echo "::warning::CI failed for version ${{ steps.versions.outputs.current }}, rolled back to ${{ steps.versions.outputs.previous }}"

  # -----------------------------------------------------------------------
  # Stage 3: full-pipeline
  # -----------------------------------------------------------------------
  full-pipeline:
    name: full pipeline (CLI end-to-end)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run full pipeline tests (stubbed models, offline)
        env:
          LARP_ROUTER_API_KEY: stub
          OPENROUTER_API_KEY: stub
          NVIDIA_API_KEY: stub
        run: |
          python tests/ci_full_pipeline.py

  # -----------------------------------------------------------------------
  # Stage 4: docker (build + test container)
  # -----------------------------------------------------------------------
  docker:
    name: docker build and test
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read project version
        run: |
          echo "STOCK_REORDER_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: stock-reorder-backend:local
          build-args: |
            STOCK_REORDER_VERSION=${{ env.STOCK_REORDER_VERSION }}

      - name: Test container health check
        run: |
          docker run --rm --name stock-reorder-test \
            -e LARP_ROUTER_API_KEY=stub \
            -e OPENROUTER_API_KEY=stub \
            -e NVIDIA_API_KEY=stub \
            -e STOCK_REORDER_KILL_SWITCH=0 \
            stock-reorder-backend:local --routing

      - name: Test container kill switch
        run: |
          set +e
          docker run --rm --name stock-reorder-kill \
            -e STOCK_REORDER_KILL_SWITCH=1 \
            stock-reorder-backend:local --routing > /dev/null 2>&1
          code=$?
          echo "Kill switch exit code: $code"
          test "$code" -eq 3

  # -----------------------------------------------------------------------
  # Stage 5: package (build delivery zip)
  # -----------------------------------------------------------------------
  package:
    name: build the delivery package
    runs-on: ubuntu-latest
    needs: [test, full-pipeline]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build
        run: python deliver.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-reorder-agents
          path: dist/stock-reorder-agents.zip

  # -----------------------------------------------------------------------
  # Stage 6: release (git tag on version bump)
  # -----------------------------------------------------------------------
  release:
    name: create git tag and release
    runs-on: ubuntu-latest
    needs: [test, full-pipeline]
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, 'bump') || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${VERSION}
          name: Release v${VERSION}
          body: |
            Automated release v${VERSION}
            - SemVer: ${{ env.VERSION }}
            - CI: All tests passed
          files: dist/stock-reorder-agents.zip