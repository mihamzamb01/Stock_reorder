version: "3.9"

services:
  # =============================================================================
  # Backend - LangGraph Pipeline (Python)
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: stock-reorder-backend:${STOCK_REORDER_VERSION:-latest}
    container_name: stock-reorder-backend
    environment:
      - DATABASE_URL=sqlite:////data/stock_reorder.db
      - RUNS_DIR=/runs
      - LARP_ROUTER_API_KEY=${LARP_ROUTER_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - MODEL_REORDER_PROVIDER=${MODEL_REORDER_PROVIDER:-larprouter}
      - MODEL_SUPPLIER_PROVIDER=${MODEL_SUPPLIER_PROVIDER:-larprouter}
      - MODEL_COST_PROVIDER=${MODEL_COST_PROVIDER:-larprouter}
      - STOCK_REORDER_KILL_SWITCH=${STOCK_REORDER_KILL_SWITCH:-0}
      - KILL_SWITCH_REASON=${KILL_SWITCH_REASON}
    volumes:
      - stock_reorder_data:/data
      - stock_reorder_runs:/runs
      - ./.env:/app/.env:ro
    command: ["--warehouse", "WH-NORTH", "--max-items", "5"]
    healthcheck:
      test: ["CMD", "python", "main.py", "--routing"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - stock-reorder-network

  # =============================================================================
  # Frontend - React Dashboard (Node.js + Nginx)
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: stock-reorder-frontend:${STOCK_REORDER_VERSION:-latest}
    container_name: stock-reorder-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stock-reorder-network

  # =============================================================================
  # Backend API Server (Optional - for dashboard API calls)
  # =============================================================================
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: stock-reorder-backend-api:${STOCK_REORDER_VERSION:-latest}
    container_name: stock-reorder-backend-api
    environment:
      - DATABASE_URL=sqlite:////data/stock_reorder.db
      - RUNS_DIR=/runs
      - STOCK_REORDER_KILL_SWITCH=${STOCK_REORDER_KILL_SWITCH:-0}
    volumes:
      - stock_reorder_data:/data
      - stock_reorder_runs:/runs
    command: ["observability_server.py"]
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stock-reorder-network

networks:
  stock-reorder-network:
    driver: bridge

volumes:
  stock_reorder_data:
  stock_reorder_runs: