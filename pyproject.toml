[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-reorder-agents"
version = "0.2.0"
description = "Multi-agent stock reorder and supplier sourcing pipeline built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.16",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "sqlalchemy>=2.1.5",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "rich>=13.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=9.1.1", "ruff>=0.15.0", "sqlglot>=25.0.0"]

[project.scripts]
stock-reorder = "main:main"

[tool.setuptools]
packages = ["agents", "config", "db"]
py-modules = ["main", "graph", "llm", "reporting", "observability", "schemas", "state"]

[tool.setuptools.package-data]
db = ["*.sql", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]
